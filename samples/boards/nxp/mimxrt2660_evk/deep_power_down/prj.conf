CONFIG_POWEROFF=y
CONFIG_HWINFO=y
CONFIG_WUC=y
CONFIG_GPIO=y
CONFIG_COUNTER=y

# The DPD2 timer wakeup sets the VBAT LPTMR alarm itself. The alarm support only
# defaults to y when CONFIG_PM makes the VBAT LPTMR the system timer companion.
CONFIG_COUNTER_MCUX_LPTMR_ALARM=y
