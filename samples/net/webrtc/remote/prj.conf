CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CBPRINTF_NANO=y
# The decoder runs in the thread that serves the calls
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_MPIPE=y
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=4
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_APP_SRC=y
CONFIG_MPIPE_BASE_APP_SINK=y
CONFIG_MPIPE_VID=y
CONFIG_MPIPE_VID_H264_DECODER=y
CONFIG_MPIPE_PIPELINE_SERVER=y
CONFIG_MPIPE_VID_PIPELINE_SERVER=y
CONFIG_MPIPE_ERPC_VID_SERVER=y
CONFIG_MPIPE_THREADS_NUM=1
CONFIG_MPIPE_THREAD_STACK_SIZE=1024
CONFIG_MPIPE_NET_BUF_POOL_COUNT=4

# Every buffer lives in the memory of the other core: the pools of this
# pipeline are never used, so they reserve next to nothing
CONFIG_MPIPE_BASE_APP_SRC_BUF_SZ=4
CONFIG_MPIPE_BASE_APP_SRC_POOL_NUM=1
CONFIG_MPIPE_VID_H264_DECODER_MAX_OUT_FRAME_SIZE=4
CONFIG_MPIPE_VID_H264_DECODER_POOL_NUM=1
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=1
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=1024

# The picture buffers of a 320x240 stream. The heap is larger than the RAM of
# this core, which would otherwise select the heap format for small heaps.
CONFIG_H264SWDEC_HEAP_SIZE=393216
CONFIG_SYS_HEAP_AUTO=y
CONFIG_H264SWDEC_MAX_FRAME_WIDTH=320
CONFIG_H264SWDEC_MAX_FRAME_HEIGHT=240
CONFIG_H264SWDEC_MAX_FRAME_SIZE=76800

CONFIG_ERPC=y
CONFIG_ERPC_TRANSPORT_IPC_SERVICE=y
CONFIG_ERPC_ALLOCATION_POLICY_STATIC=y
CONFIG_ERPC_CODEC_COUNT=2
CONFIG_ERPC_DEFAULT_BUFFER_SIZE=4096
CONFIG_MPIPE_ERPC_SERVER=y
CONFIG_MPIPE_ERPC_SERVERS_NUM=1
CONFIG_RL_API_HAS_ZEROCOPY=y
CONFIG_RL_USE_STATIC_API=y
# The image of this core is only started once the other core is up
CONFIG_IPC_SERVICE_BACKEND_RPMSG_LITE_LINK_UP_TIMEOUT_MS=60000

# The bus carries end-of-stream and errors, never data
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
