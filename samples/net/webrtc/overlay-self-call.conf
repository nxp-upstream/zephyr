# A call of the board with itself, through the loopback of the IP stack: the
# media of a call without a network. Add overlay-mpipe.conf for the media on
# the Multimedia Pipeline subsystem.
CONFIG_ZEPHYRTC_MODE_SELF_CALL=y
CONFIG_ZEPHYRTC_VIDEO_H264=y

# The loopback interface is the only one, with an address libpeer accepts as
# a host candidate
CONFIG_NET_LOOPBACK=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_ETH_DRIVER=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# A key frame of 320x240 video is 30 packets, each in 11 fragments of the
# default size, and both endpoints of the call share the pools
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=512
CONFIG_NET_BUF_TX_COUNT=512
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=8
