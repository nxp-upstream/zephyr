# The media of the call on the Multimedia Pipeline subsystem: add this file to
# an external-answerer configuration with video, and the overlay of the board
# that includes pipelines.dtsi. The elements the devicetree names are built by
# themselves; what is left here is their memory.
CONFIG_ZEPHYRTC_MEDIA_MPIPE=y

CONFIG_MPIPE=y
# The four pipelines and the queue in front of the audio codec
CONFIG_MPIPE_THREADS_NUM=5
# The encoder and the decoder run in the streaming threads
CONFIG_MPIPE_THREAD_STACK_SIZE=16384

# 100 ms of received audio, in blocks of 20 ms
CONFIG_MPIPE_BASE_QUEUE_MAX_SIZE=5
# The application takes the frames and the blocks within a millisecond
CONFIG_MPIPE_BASE_APP_SINK_QUEUE_DEPTH=4
# The largest NAL unit of the peer's stream; the audio blocks are smaller
CONFIG_MPIPE_BASE_APP_SRC_BUF_SZ=32768
# The frames a network gap of 250 ms delivers at once wait for the decoder
CONFIG_MPIPE_BASE_APP_SRC_QUEUE_DEPTH=8
CONFIG_MPIPE_BASE_APP_SRC_POOL_NUM=16

# Two audio pipelines, each with its pool of 20 ms blocks: 2560 bytes from the
# microphone, up to 3840 bytes to a codec that runs at 48 kHz
CONFIG_MPIPE_AUD_BUFFER_POOL_COUNT=2
CONFIG_MPIPE_AUD_BUFFER_POOL_SZ_MAX=3840
CONFIG_MPIPE_AUD_BUFFER_POOL_NUM_MAX=16

# Buffer headers in flight: the camera frames, the frames of the converters,
# the audio blocks of both directions
CONFIG_MPIPE_NET_BUF_POOL_COUNT=40

# Video buffers of every pool in the image: the camera's own queue of BGRX32
# frames, the frames of the two converters, slack
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=10
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=2097152

# The bus carries end-of-stream and errors, never data
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
