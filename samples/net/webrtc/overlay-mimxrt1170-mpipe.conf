# MIMXRT1170-EVKB devices and memory placement for the pipelines of
# overlay-mpipe.conf: OV5640 camera, RK055 panel on the LCDIFv2, MICFIL
# microphones and WM8962 codec.
CONFIG_ZEPHYRTC_AUDIO_RT1170=y

CONFIG_VIDEO=y
CONFIG_DISPLAY=y

CONFIG_I2S=y
CONFIG_I2S_TX_BLOCK_COUNT=16
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
# 160 ms of captured blocks at most wait in the driver
CONFIG_DMIC_NXP_MICFIL_QUEUE_SIZE=8
CONFIG_AUDIO_CODEC=y
CONFIG_I3C=y

# The PXP converts the video of the peer, turns it and scales it by two to
# 480x640, which a display plane scans out in the middle of the 720x1280
# panel: no driver framebuffer. A scale of three fills the width of the panel,
# but the plane then loads the SDRAM enough to double the processor load.
CONFIG_ZEPHYRTC_DISPLAY_ROTATION=90
CONFIG_ZEPHYRTC_DISPLAY_SCALE=2
CONFIG_ZEPHYRTC_DISPLAY_PLANE=0
CONFIG_MCUX_LCDIFV2_FB_NUM=0

# Video buffers of every pool in the image: the camera's own queue of BGRX32
# frames, the frames of the converter, the input frames of the PXP and its
# two output frames of 720x960 RGB565, slack
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=12
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=5242880

# The flash is a serial one and the default RAM is the SDRAM: the codecs,
# SRTP, the WebRTC stack and the IP stack run from the instruction TCM, the
# only RAM the board file lets code run from, and the codecs work in the
# on-chip RAM
CONFIG_ZEPHYRTC_CODE_RELOCATE=y
CONFIG_ZEPHYRTC_MEDIA_CODE_RAM_NAME="ITCM"
CONFIG_ZEPHYRTC_NET_CODE_RAM_NAME="ITCM"
CONFIG_ZEPHYRTC_CODEC_DATA_RELOCATE=y
CONFIG_ZEPHYRTC_ENCODER_RAM_NAME="OCRAM1"
CONFIG_ZEPHYRTC_DECODER_RAM_NAME="OCRAM2"

# The OV5640 delivers YUV with 8 bits per component: smooth areas keep their
# colour, which its RGB565 rounds to patches, and the encoder needs no matrix
CONFIG_ZEPHYRTC_CAMERA_VUYX32=y

# Code that runs from RAM gains from being optimized for speed
CONFIG_SPEED_OPTIMIZATIONS=y
