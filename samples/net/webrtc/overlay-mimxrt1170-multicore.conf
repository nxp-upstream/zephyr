# Decode the video of the peer on the Cortex-M4 of the MIMXRT1170-EVKB. Add
# this file after overlay-mimxrt1170-mpipe.conf, build with --sysbuild and
# add boards/mimxrt1170_evk_mimxrt1176_cm7_B_multicore.overlay.
CONFIG_SECOND_CORE_MCUX=y
CONFIG_ZEPHYRTC_DECODER_REMOTE=y

# The decoder element is in the image of the second core
CONFIG_MPIPE_VID_H264_DECODER=n
# The decoder library stays in this image for the media code of the sample:
# its heap is not used
CONFIG_H264SWDEC_HEAP_SIZE=1024

CONFIG_MPIPE_RPC=y
CONFIG_MPIPE_ERPC=y
CONFIG_MPIPE_ERPC_CHANNELS_NUM=1
CONFIG_ERPC=y
CONFIG_ERPC_TRANSPORT_IPC_SERVICE=y
CONFIG_ERPC_ALLOCATION_POLICY_STATIC=y
CONFIG_ERPC_CODEC_COUNT=2
CONFIG_ERPC_DEFAULT_BUFFER_SIZE=4096
CONFIG_RL_API_HAS_ZEROCOPY=y
CONFIG_RL_USE_STATIC_API=y
