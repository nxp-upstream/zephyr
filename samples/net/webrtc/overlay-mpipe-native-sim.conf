# native_sim devices for the pipelines of overlay-mpipe.conf: the emulated
# camera comes from the video-sw-generator snippet, the display is the SDL one.
CONFIG_VIDEO=y
CONFIG_DISPLAY=y

# The emulated I2S writes what the peer says to a file through the dummy codec;
# the emulated DMIC is the microphone
CONFIG_I2S=y
CONFIG_I2S_NATIVE_SIM=y
CONFIG_I2S_NATIVE_SIM_TX_PATH="webrtc_audio_rx.pcm"
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_AUDIO_CODEC_DUMMY=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NATIVE_SIM=y
# The dummy codec runs at 48 kHz only
CONFIG_ZEPHYRTC_HEADPHONES_SAMPLE_RATE=48000
