# Same as the other mpipe samples on this board: the camera DMA and the NPU
# share buffers with the CPU without cache maintenance.
CONFIG_DCACHE=n

# The model and its tensor arena fill SRAM1, so the capture buffers go to the
# SRAM_SHARED0 region the overlay declares. The camera driver asks for two
# buffers, each frame of the model input size, 320x240 RGB565, being 153600
# bytes; the heap holds those two plus the alignment and heap overhead.
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=327680
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="SRAM_SHARED0"
