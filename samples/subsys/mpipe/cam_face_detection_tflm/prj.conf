CONFIG_LOG=y
CONFIG_GPIO=y

CONFIG_MPIPE=y
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=4
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_APP_SINK=y
CONFIG_MPIPE_BASE_QUEUE=y
CONFIG_MPIPE_BASE_TEE=y
CONFIG_MPIPE_DISP=y
CONFIG_MPIPE_VID=y
CONFIG_MPIPE_VID_OVERLAY=y
CONFIG_MPIPE_PLAYER=y

# One streaming thread for the pipeline, one for the display branch's queue
CONFIG_MPIPE_THREADS_NUM=2
CONFIG_MPIPE_NET_BUF_POOL_COUNT=3

# The bus carries end-of-stream and errors, never data
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y

# C++ with the full standard library, required by TFLite Micro
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_GLIBCXX_LIBCPP=y

# TensorFlow Lite Micro with the CMSIS-NN kernels
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# NXP Neutron NPU driver and firmware, and its TFLM kernel
CONFIG_TFLM_NXP_NEUTRON=y

CONFIG_FPU=y

# main() loads the model and sets the pipeline up
CONFIG_MAIN_STACK_SIZE=8192

# The result work item runs on the system work queue: it copies a detection
# result and builds the overlay rectangles on the stack, then prints. The
# default 1024 bytes overflow on the first result.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
