# 3 JPEG buffers for the parser: 1 in the queue, 1 being parsed, 1 at the decoder
# 1 RGB565 buffer for the decoder output
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=471040

# Both cores access the frames: keep them out of the M7 caches
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="OCRAM1"

CONFIG_SAMPLE_INCLUDE_REMOTE_DIR=y
CONFIG_SECOND_CORE_MCUX=y

CONFIG_MCUX_ELCDIF_FB_NUM=1
