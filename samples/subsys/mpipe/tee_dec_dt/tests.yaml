sample:
  name: Tee pipeline described in the devicetree

tests:
  sample.mpipe.tee_dec_dt:
    tags:
      - mpipe
      - video
      - filesystem
    platform_allow:
      - native_sim/native/64
      - mimxrt1170_evk@B/mimxrt1176/cm7
    integration_platforms:
      - native_sim/native/64
    modules:
      - jpegdec
    harness: console
    extra_args:
      - platform:mimxrt1170_evk@B/mimxrt1176/cm7:SHIELD="rk055hdmipi4ma0"
    harness_config:
      type: one_line
      regex:
        - "end of stream"
