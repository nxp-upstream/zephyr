# Zephyr Wi-Fi configuration for MURATA IW61x

# Config WIFI
CONFIG_WIFI=y
CONFIG_NXP_WIFI_SOFTAP_SUPPORT=y
CONFIG_ETH_NXP_ENET=n
CONFIG_MDIO_NXP_ENET=n
CONFIG_ETH_PHY_DRIVER=n
CONFIG_WIFI_NXP=y
CONFIG_NXP_IW61X=y
CONFIG_NXP_WIFI_SHELL=y
CONFIG_NXP_IW612_MURATA_2EL_M2=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=32
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=100
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_L2_WIFI_MGMT=y

CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_EVENTS=y
CONFIG_SYS_HEAP_AUTO=y
CONFIG_SCHED_MULTIQ=y

#firmware
CONFIG_NXP_MONOLITHIC_WIFI=y

# wifi driver
CONFIG_WIFI_SHELL_MAX_AP_STA=8
CONFIG_WIFI_MGMT_AP_MAX_NUM_STA=8
CONFIG_NXP_WIFI_TX_TASK_STACK_SIZE=4096
CONFIG_NXP_WIFI_DRIVER_TASK_STACK_SIZE=4096
CONFIG_NXP_WIFI_POWERSAVE_TASK_STACK_SIZE=4096
# net threads priority
CONFIG_IDLE_STACK_SIZE=1024

CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=40

CONFIG_NET_CONFIG_AUTO_INIT=n

# CONFIG_WIFI_LOG_LEVEL_DBG=y
# CONFIG_NXP_WIFI_EXTRA_DEBUG=y
# CONFIG_NXP_WIFI_DEBUG_BUILD=y
# CONFIG_NXP_WIFI_OS_DEBUG=y
# CONFIG_NXP_WIFI_NET_DEBUG=y
# CONFIG_NXP_WIFI_WLCMGR_DEBUG=y
# CONFIG_NXP_WIFI_UAP_DEBUG=y
# CONFIG_NXP_WIFI_PKT_DEBUG=y

CONFIG_NXP_WIFI_SOFTAP_IP_ADDRESS="192.0.2.1"
CONFIG_NXP_WIFI_SOFTAP_IP_GATEWAY="192.0.2.1"
CONFIG_NXP_WIFI_SOFTAP_IP_MASK="255.255.255.0"
# DHCPv4 pool base must not overlap the soft-AP/server address (192.0.2.1).
CONFIG_NXP_WIFI_SOFTAP_IP_BASE="192.0.2.10"

# CONFIG_CODE_DATA_RELOCATION_SRAM=y

CONFIG_NET_PKT_RX_COUNT=96
CONFIG_NET_PKT_TX_COUNT=96
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
# Must be a multiple of MLAN_SDIO_BLOCK_SIZE (256) for the NXP WiFi
# SDIO zero-copy TX/RX path (see wifi-sdio.c compile-time assertion).
CONFIG_NET_BUF_DATA_SIZE=2560
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_TC_RX_COUNT=1
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=20
CONFIG_NET_IF_MAX_IPV4_COUNT=3
CONFIG_NET_IPV4_FRAGMENT=y
CONFIG_NET_IPV4_FRAGMENT_MAX_COUNT=3
CONFIG_NET_IPV4_FRAGMENT_MAX_PKT=7
CONFIG_NET_IPV4_FRAGMENT_TIMEOUT=3
CONFIG_NET_MAX_CONN=10
CONFIG_NET_L2_ETHERNET=y


CONFIG_SDIO_STACK=y
CONFIG_SD_CMD_RETRIES=3
CONFIG_SD_RETRY_COUNT=0

# CONFIG_NXP_WIFI_IO_DEBUG=y
# CONFIG_SD_LOG_LEVEL_DBG=y
# CONFIG_NXP_WIFI_PKT_DEBUG=y

CONFIG_NET_DEFAULT_IF_WIFI=y
CONFIG_SCHED_MULTIQ=y
CONFIG_NXP_WIFI_TX_RX_ZERO_COPY=y
CONFIG_NXP_WIFI_WMM_UAPSD=n
CONFIG_NXP_WIFI_ROAMING=n
CONFIG_NXP_WIFI_AUTO_POWER_SAVE=n
