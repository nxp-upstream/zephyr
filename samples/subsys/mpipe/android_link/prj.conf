# Kernel options
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_INIT_STACKS=y

# Shell
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_DEVICE_SHELL=y

# Logging
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_NET_LOG=y

# Display
CONFIG_DISPLAY=y

# mpipe media pipeline framework
CONFIG_MPIPE=y
# Audio capabilities carry five fields; an intersection may hold one more
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=6
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_CAPS_FILTER=y
CONFIG_MPIPE_BASE_QUEUE=y
# Video: the source and two queues; audio and microphone: a source and a queue
# each; plus slack
CONFIG_MPIPE_THREADS_NUM=10
CONFIG_MPIPE_THREAD_STACK_SIZE=4096
CONFIG_MPIPE_NET=y
CONFIG_MPIPE_IMG=y
CONFIG_MPIPE_IMG_JPEG_DECODER=y
CONFIG_MPIPE_DISP=y
CONFIG_MPIPE_AUD=y
CONFIG_MPIPE_PLAYER=y
# One player per pipeline: video, audio and microphone
CONFIG_MPIPE_PLAYER_NUM=3
CONFIG_ZBUS_PRIORITY_BOOST=n

# Audio output: the I2S codec sink, fed 10 ms blocks of 48 kHz 16-bit stereo
# (1920 bytes) from a slab of up to 32 of them: 15 queued, up to 16 in the I2S
# driver's queue, the one being filled.
CONFIG_I2S=y
CONFIG_AUDIO_CODEC=y
CONFIG_MPIPE_AUD_BUFFER_POOL_SZ_MAX=4096
CONFIG_MPIPE_AUD_BUFFER_POOL_NUM_MAX=32

# Microphone input: the DMIC source, 10 ms blocks of 16 kHz 32-bit mono (640
# bytes) from a slab of its own: the driver's queue, 10 queued, slack. Two
# slabs, one per audio pipeline, each with a slice of the store.
CONFIG_AUDIO_DMIC=y
CONFIG_MPIPE_AUD_BUFFER_POOL_COUNT=2

# Longest JPEG frame accepted, and the size of the parser's copy buffers. A
# text-heavy 720x1280 screen compresses to well over 256 KB.
CONFIG_MPIPE_IMG_JPEG_PARSER_MAX_FRAME_SIZE=524288
CONFIG_MPIPE_IMG_JPEG_DECODER_MAX_OUT_FRAME_SIZE=1843200

# A frame inside one receive chunk reaches the decoder as a view of the chunk;
# only a frame split across two chunks is copied into one of these buffers.
CONFIG_MPIPE_IMG_JPEG_PARSER_POOL_NUM=4

# Buffer headers in flight across the three pipelines: the video views
# (pending input pieces, frames in the queues and in the decoder, decoded
# frames), the audio blocks in the audio queue and the I2S driver, the
# microphone blocks in the DMIC driver and the microphone queue, plus slack.
CONFIG_MPIPE_NET_BUF_POOL_COUNT=64

# Decoded frames in flight: one being decoded, one waiting in queue_dec, one
# being displayed, plus slack for a chain of frames decoded from one read.
CONFIG_MPIPE_IMG_JPEG_DECODER_POOL_NUM=6

# The queues between the threads are bounded and leak their oldest buffer
# (see main.c); this is the largest size a queue may be set to, the audio one.
CONFIG_MPIPE_BASE_QUEUE_MAX_SIZE=16

# The stream is received into 256 KB chunks, two to three frames each, and
# every frame inside a chunk reaches the decoder as a view of it. Four chunks:
# one being filled, one or two pinned by frames waiting or being decoded.
CONFIG_MPIPE_NET_SRC_BUF_SIZE=262144
CONFIG_MPIPE_NET_SRC_NUM_BUFS=4


# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=3

CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_IF_MAX_IPV4_COUNT=2

CONFIG_NET_TCP=y

# DHCPV4 Server & interface
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y

CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_MAX_CONTEXTS=64

# Packet pools for the Ethernet and native_sim builds; overlay-wifi.conf sets
# larger ones. The defaults, 36 buffers of 128 bytes each way, hold under
# 5 KB: too little for a megabyte per second of video coming in and the
# microphone's 64 KB/s going out beside the acknowledgements.
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_DATA_SIZE=1024

CONFIG_NET_MAX_CONN=64
CONFIG_NET_L2_ETHERNET=y

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

CONFIG_SHELL_CMDS_RESIZE=n

CONFIG_CACHE_MANAGEMENT=y
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_EVENTS=y

# Optimization for network
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# Config Input: the touch controller and the user button
CONFIG_INPUT=y
CONFIG_GPIO=y
CONFIG_INPUT_GT911_MAX_TOUCH_POINTS=5
CONFIG_INPUT_QUEUE_MAX_MSGS=128
CONFIG_NET_SOCKET_MAX_SEND_WAIT=10
