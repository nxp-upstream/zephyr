# native_sim runs on the host: use the SDL display and SDL pointer input
# instead of the MIPI panel / GT911 touch controller of the hardware target.
CONFIG_SDL_DISPLAY=y
CONFIG_INPUT=y
CONFIG_INPUT_SDL_TOUCH=y

# Networking is provided by the native TAP Ethernet driver on the host.
CONFIG_ETH_NATIVE_TAP=y
CONFIG_NET_L2_ETHERNET=y

# The following options are only meaningful on the Cortex-M hardware target
# and must be disabled for the host build.
CONFIG_CACHE_MANAGEMENT=n
CONFIG_NET_STACK_CODE_RELOCATE=n

# Verbose mpipe logging to trace pipeline negotiation and per-frame display
# writes while bringing up the sample on native_sim.
CONFIG_LOG=y
CONFIG_MPIPE_LOG_LEVEL_DBG=y


# Audio on the host: the emulated I2S writes what it is given to a file, the
# dummy codec accepts any configuration.
CONFIG_I2S=y
CONFIG_I2S_NATIVE_SIM=y
CONFIG_AUDIO_CODEC=y
CONFIG_AUDIO_CODEC_DUMMY=y
CONFIG_I2S_NATIVE_SIM_TX_FILE_PATH="build/android_link_audio_tx.pcm"
# The emulated I2S queues eight blocks; start 60 ms behind the sender against
# the jitter of a stream arriving in real time through the host's TAP polling.
CONFIG_MPIPE_AUD_I2S_SINK_PRIME_BLOCKS=6

# Microphone on the host: the emulated DMIC
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NATIVE_SIM=y
