# Set the SDRAM up through the device configuration data block rather than the
# board's default external memory configuration data. Everything this sample
# streams through lives in SDRAM.
CONFIG_DEVICE_CONFIGURATION_DATA=y

# Run the networking stack from ITCM rather than from the XIP flash.
CONFIG_NET_STACK_CODE_RELOCATE=y
CONFIG_NET_STACK_CODE_RAM_NAME="ITCM"
