#
# Investigation aid: per-thread CPU accounting and stack usage from the shell
# ("kernel threads", "kernel stacks", "net stats"), with a log buffer large
# enough for the per-second stage statistics. Logging stays deferred: in
# immediate mode every thread writes to the console itself, and a burst of
# errors then stalls the threads behind a 115200 baud UART.

CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_KERNEL_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_LOG_BUFFER_SIZE=8192
