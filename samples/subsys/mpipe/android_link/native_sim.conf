# Host-run convenience overlay for native_sim, applied by run_native_sim.sh.
# It is not used by a board build, so it changes nothing on the RT1170 target.

# Bind the native pty UART, and with it the Zephyr shell, to the process stdin
# and stdout rather than a separate pseudo-tty. The interactive player prompt
# (p/s/r/q) then appears in the terminal that launched the script.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# With the shell sharing that one terminal, route the log output through the
# shell backend so log lines are serialized with the prompt instead of
# interleaving with and corrupting the line being typed.
CONFIG_SHELL_LOG_BACKEND=y
