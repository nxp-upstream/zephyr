CONFIG_LOG=y

# The pipeline is built on the main stack at boot
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# The framework, its elements and the player are enabled by the pipeline node
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=3
# The frame on screen, the one in flight and one to spare
CONFIG_MPIPE_NET_BUF_POOL_COUNT=3
# The source negotiates from the player's thread, across the cores
CONFIG_MPIPE_PLAYER_WORKER_STACK_SIZE=8192

# eRPC over the IPC service, one channel, nothing from the heap
CONFIG_ERPC=y
CONFIG_ERPC_TRANSPORT_IPC_SERVICE=y
CONFIG_ERPC_ALLOCATION_POLICY_STATIC=y
CONFIG_ERPC_CODEC_COUNT=1
CONFIG_ERPC_DEFAULT_BUFFER_SIZE=4096

# RPMsg-Lite
CONFIG_RL_API_HAS_ZEROCOPY=y
CONFIG_RL_USE_STATIC_API=y
CONFIG_TIMESLICE_SIZE=1

# The bus carries end-of-stream and errors, never data: it needs neither
# zbus priority boost nor zbus logging of its own.
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
