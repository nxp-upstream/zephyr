CONFIG_CACHE_MANAGEMENT=y
CONFIG_REQUIRES_FULL_LIBC=y

# No console: the LPUART of the board console is the shell of the Cortex-M33,
# and its driver init here would reset it under that shell. The server keeps
# its log lines for the Cortex-M33, which reads and prints them.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_EARLY_CONSOLE=n

# The eRPC server runs in main, below the eRPC, IPC service and audio
# function calls; the 1 KiB default overflows. Not measured, sized with
# margin.
CONFIG_MAIN_STACK_SIZE=4096

# eRPC server over the IPC service (RPMsg-Lite on MU4)
CONFIG_ERPC=y
CONFIG_ERPC_TRANSPORT_IPC_SERVICE=y
CONFIG_ERPC_ALLOCATION_POLICY_STATIC=y
CONFIG_ERPC_CODEC_COUNT=1
# The eRPC port routes operator new to k_malloc, so a heap must exist even
# with static allocation
CONFIG_HEAP_MEM_POOL_SIZE=1024

# Same message size as the Cortex-M33 (prj.conf of each sample). Only buffer
# addresses and formats travel, so the messages stay small.
CONFIG_ERPC_DEFAULT_BUFFER_SIZE=1008
CONFIG_RL_BUFFER_PAYLOAD_SIZE=1008
CONFIG_RL_USE_STATIC_API=y
# The shared area is cached on this core: RPMsg-Lite flushes and invalidates
# the vrings and buffers it hands over
CONFIG_RL_USE_DCACHE=y

# Blocks the server takes: 32-bit PCM of 1 to 2 channels, 4 to 1024 samples
# per channel, in buffers aligned on the 256-byte cache line of the HiFi4
CONFIG_AUD_REMOTE_PCM_BIT_WIDTH=32
CONFIG_AUD_REMOTE_MAX_CHANNELS=2
CONFIG_AUD_REMOTE_MIN_BLOCK_SAMPLES=4
CONFIG_AUD_REMOTE_MAX_BLOCK_SAMPLES=1024
CONFIG_AUD_REMOTE_BUF_ALIGN=256
