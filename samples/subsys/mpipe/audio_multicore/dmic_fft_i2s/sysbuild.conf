# Audio format and gain, given to both the Cortex-M33 and the HiFi4 image
# (see Kconfig.sysbuild for the constraints on each value)

# Sample rate, in Hz: the only one the MICFIL driver captures at
SB_CONFIG_DMIC_FFT_I2S_SAMPLE_RATE=16000

# Duration of one audio block, in microseconds. Rate x interval is the FFT
# length and must be a power of two.
SB_CONFIG_DMIC_FFT_I2S_FRAME_INTERVAL_US=16000

# Gain applied on the HiFi4 before the FFT and again after the inverse FFT,
# in percent
SB_CONFIG_DMIC_FFT_I2S_GAIN_PERCENT=800
