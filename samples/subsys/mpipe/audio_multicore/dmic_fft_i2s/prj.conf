CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CACHE_MANAGEMENT=y

CONFIG_MPIPE=y
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_CAPS_FILTER=y
CONFIG_MPIPE_BASE_QUEUE=y
# The pipeline thread plus the queue thread
CONFIG_MPIPE_THREADS_NUM=2
CONFIG_MPIPE_AUD=y
CONFIG_MPIPE_PLAYER=y
# Microphone blocks plus the HiFi4 buffers the four stages hold. Not
# measured: 20 was enough for three stages, 4 more for the output gain.
CONFIG_MPIPE_NET_BUF_POOL_COUNT=24

CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_CODEC=y
CONFIG_I2S=y

# The codec default (0 dB) is loud next to the microphones: start lower
CONFIG_MPIPE_AUD_I2S_CODEC_SINK_SET_OUTPUT_VOLUME=y

# The HiFi4 computes gain, FFT, IFFT and gain: eRPC client over the IPC service
# (RPMsg-Lite on MU4)
CONFIG_MPIPE_RPC=y
CONFIG_MPIPE_ERPC=y

CONFIG_ERPC=y
CONFIG_ERPC_TRANSPORT_IPC_SERVICE=y
CONFIG_ERPC_ALLOCATION_POLICY_STATIC=y
CONFIG_ERPC_CODEC_COUNT=1
# The eRPC port routes operator new to k_malloc, so a heap must exist even
# with static allocation
CONFIG_HEAP_MEM_POOL_SIZE=1024

# Only buffer addresses and formats travel, so the messages stay small. The
# eRPC buffer is the RPMsg-Lite payload, 2^n - 16 bytes: the same value on
# both cores.
CONFIG_ERPC_DEFAULT_BUFFER_SIZE=1008
CONFIG_RL_BUFFER_PAYLOAD_SIZE=1008
CONFIG_RL_USE_STATIC_API=y

# The bus carries end-of-stream and errors, never data: it needs neither
# zbus priority boost nor zbus logging of its own.
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
