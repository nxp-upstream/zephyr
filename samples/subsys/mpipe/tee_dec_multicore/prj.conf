CONFIG_LOG=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_MPIPE=y
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=3
CONFIG_MPIPE_RPC=y
CONFIG_MPIPE_ERPC=y
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_APP_SRC=y
CONFIG_MPIPE_BASE_CAPS_FILTER=y
CONFIG_MPIPE_BASE_QUEUE=y
CONFIG_MPIPE_BASE_TEE=y
CONFIG_MPIPE_BIN_MAX_CHILDREN=12
CONFIG_MPIPE_BASE_TEE_MAX_SRC_PADS_NUM=3
# The pipeline thread plus one queue thread per branch
CONFIG_MPIPE_THREADS_NUM=4
# The thread of the recording branch writes the file
CONFIG_MPIPE_THREAD_STACK_SIZE=2048
CONFIG_MPIPE_IMG=y
CONFIG_MPIPE_VID=y
CONFIG_MPIPE_VID_OVERLAY=y
CONFIG_MPIPE_DISP=y
CONFIG_MPIPE_FS=y
CONFIG_MPIPE_PLAYER=y
# Twelve elements negotiate from the player's thread, two of them across the cores
CONFIG_MPIPE_PLAYER_WORKER_STACK_SIZE=10240

# The stream is pushed in chunks a 320x240 JPEG frame fits in, so a frame
# usually leaves the parser as a view of its chunk: one chunk being filled,
# one pending in the parser and one pinned by the frames queued in the branches.
CONFIG_MPIPE_BASE_APP_SRC_BUF_SZ=32768
CONFIG_MPIPE_BASE_APP_SRC_POOL_NUM=4
# A frame cut across two chunks is copied
CONFIG_MPIPE_IMG_JPEG_PARSER_MAX_FRAME_SIZE=76800
# The views of the frames of a chunk, the clients' buffers and slack
CONFIG_MPIPE_NET_BUF_POOL_COUNT=16

# The recording goes to the SD card
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y

# The text of the overlay
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y

# eRPC over the IPC service, one channel per client element, nothing from the heap
CONFIG_ERPC=y
CONFIG_ERPC_TRANSPORT_IPC_SERVICE=y
CONFIG_ERPC_ALLOCATION_POLICY_STATIC=y
CONFIG_ERPC_CODEC_COUNT=2
CONFIG_ERPC_DEFAULT_BUFFER_SIZE=4096
CONFIG_MPIPE_ERPC_CHANNELS_NUM=2

# RPMsg-Lite
CONFIG_RL_API_HAS_ZEROCOPY=y
CONFIG_RL_USE_STATIC_API=y
CONFIG_TIMESLICE_SIZE=1

# The bus carries end-of-stream and errors, never data: it needs neither
# zbus priority boost nor zbus logging of its own.
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
