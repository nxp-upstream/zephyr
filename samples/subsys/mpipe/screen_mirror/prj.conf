# Kernel options
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_INIT_STACKS=y

# Shell
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_DEVICE_SHELL=y

# Logging
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_NET_LOG=y

# Display
CONFIG_DISPLAY=y

# mpipe media pipeline framework
CONFIG_MPIPE=y
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=4
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_CAPS_FILTER=y
CONFIG_MPIPE_BASE_QUEUE=y
# Two queue elements need two thread slots; give each thread a generous stack.
CONFIG_MPIPE_THREADS_NUM=5
CONFIG_MPIPE_THREAD_STACK_SIZE=4096
CONFIG_MPIPE_NET=y
CONFIG_MPIPE_IMG=y
CONFIG_MPIPE_DISP=y
CONFIG_MPIPE_PLAYER=y
CONFIG_ZBUS_PRIORITY_BOOST=n

# JPEG parser/decoder pool sizing for a 720x1280 RGB565 panel
CONFIG_MPIPE_IMG_JPEG_PARSER_MAX_FRAME_SIZE=262144
CONFIG_MPIPE_IMG_JPEG_DECODER_MAX_OUT_FRAME_SIZE=1843200

# The parser offers its own pool to the TCP source, which then receives straight
# into the buffer the parser is accumulating into and appends after the bytes
# already there. A frame split across many small reads - which is what a socket
# delivers - is completed where it already sits instead of being copied piece by
# piece into a staging buffer. Three buffers: one being filled, one being
# decoded, one spare so the reader never waits on the decoder.
CONFIG_MPIPE_IMG_JPEG_PARSER_POOL_NUM=10

# One decoded frame being displayed while the next one is decoded.
CONFIG_MPIPE_IMG_JPEG_DECODER_POOL_NUM=10

# The queue elements hold buffers between the threads they separate.
CONFIG_MPIPE_BASE_QUEUE_MAX_SIZE=4

# The TCP source's own pool is unused on this path: the parser provides the
# buffers. Keep it to the smallest that still builds.
CONFIG_MPIPE_NET_SRC_BUF_SIZE=2048
CONFIG_MPIPE_NET_SRC_NUM_BUFS=1


# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=3

CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_IF_MAX_IPV4_COUNT=2

CONFIG_NET_TCP=y

# DHCPV4 Server & interface
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y

CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_MAX_CONTEXTS=64

CONFIG_NET_MAX_CONN=64
CONFIG_NET_L2_ETHERNET=y

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

CONFIG_SHELL_CMDS_RESIZE=n

CONFIG_CACHE_MANAGEMENT=y
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_EVENTS=y

# Optimization for network
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# Config Input
CONFIG_INPUT=y
CONFIG_INPUT_GT911_MAX_TOUCH_POINTS=5
CONFIG_INPUT_QUEUE_MAX_MSGS=128
CONFIG_NET_SOCKET_MAX_SEND_WAIT=10
