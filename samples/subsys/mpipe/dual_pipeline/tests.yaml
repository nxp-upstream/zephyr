sample:
  name: Dual pipeline (audio + video) sample

tests:
  sample.mpipe.dual_pipeline:
    tags:
      - mpipe
      - audio
      - video
      - samples
    platform_allow:
      - mimxrt1170_evk@B/mimxrt1176/cm7
      - native_sim/native/64
    extra_args:
      - platform:native_sim/native/64:SNIPPET="video-sw-generator"
      - platform:mimxrt1170_evk@B/mimxrt1176/cm7:SHIELD="nxp_btb44_ov5640;rk055hdmipi4ma0"
    harness: console
    extra_configs:
      - CONFIG_TEST=y
      - CONFIG_PROP_NUM_BUFS=10
    harness_config:
      type: one_line
      regex:
        - "Starting .* pipeline"
