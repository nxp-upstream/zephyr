CONFIG_LOG=y

CONFIG_MPIPE=y
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=30
CONFIG_MPIPE_THREADS_NUM=2
# Shared net_buf pool must cover the sum of the maximum in-flight buffers of
# every running pipeline. Two pipelines run at once here, so size it larger
# than the single-pipeline default of 1.
CONFIG_MPIPE_NET_BUF_POOL_COUNT=16
CONFIG_MPIPE_BASE=y

CONFIG_MPIPE_BASE_CAPS_FILTER=y

# Audio pipeline
CONFIG_MPIPE_AUD=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_CODEC=y
CONFIG_I2S=y

# Video pipeline
CONFIG_MPIPE_VID=y
CONFIG_MPIPE_DISP=y

# The audio and video pipeline threads run at the same preemptible priority
# (CONFIG_MPIPE_THREAD_DEFAULT_PRIORITY). The video pipeline does a long CPU
# burst (720p pixel conversion) which, without time-slicing, would run to
# completion and starve the audio pipeline thread. The I2S sink drives a
# continuous bit clock, so if its TX queue is not refilled in time it
# underruns. Enable time-slicing so the audio thread can preempt the video
# thread's long CPU bursts and keep the I2S TX queue fed.
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=5


# Each pipeline is driven by its own mpipe player instance. The player layer
# supports several concurrent players; size it for the two pipelines run here.
CONFIG_MPIPE_PLAYER=y
CONFIG_MPIPE_PLAYER_NUM=2
CONFIG_MPIPE_PLAYER_WORKER_STACK_SIZE=64000

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=64000

CONFIG_MAIN_STACK_SIZE=64000
