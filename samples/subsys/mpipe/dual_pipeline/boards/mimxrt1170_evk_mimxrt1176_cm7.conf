# Audio pipeline
CONFIG_I3C=y
CONFIG_AUDIO_CODEC=y
CONFIG_AUDIO_CODEC_WM8962=y
# A 40ms audio frame at 48kHz/16-bit/2ch is 7680 bytes, so each buffer must be
# at least 8192 bytes. Keep a deep pool so several frames can be in flight at
# once, which keeps the I2S TX queue fed while the video pipeline does its long
# per-frame CPU burst.
CONFIG_MPIPE_AUD_BUFFER_POOL_SZ_MAX=65536

CONFIG_MPIPE_AUD_BUFFER_POOL_NUM_MAX=20

CONFIG_DMA_TCD_QUEUE_SIZE=4

# Video pipeline
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=11060400
CONFIG_VIDEO_ROTATION_ANGLE=270
CONFIG_VIDEO_FRAME_WIDTH=1280
CONFIG_VIDEO_FRAME_HEIGHT=720
CONFIG_MPIPE_BASE_CAPS_FILTER=y
