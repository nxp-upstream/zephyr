CONFIG_LOG=y

# The framework, its elements and the player are enabled by the pipeline node
# The pipeline thread and the two queues
CONFIG_MPIPE_THREADS_NUM=3
# Eleven elements with a hardware video transform
CONFIG_MPIPE_BIN_MAX_CHILDREN=16
# The camera pool and the transform pool both wrap driver buffers in net_bufs
# drawn from the shared header pool, and the inference branch holds one for the
# duration of an inference
CONFIG_MPIPE_NET_BUF_POOL_COUNT=8

# The bus carries end-of-stream and errors, never data: it needs neither
# zbus priority boost nor zbus logging of its own.
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
