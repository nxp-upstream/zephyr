CONFIG_BUILD_OUTPUT_INFO_HEADER=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_SECOND_CORE_MCUX=y

# Two frames of the source, 320x240 RGB565, in the free part of OCRAM2
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=393216
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="OCRAM2_VIDEO"
# The video heap is larger than the 256K a small heap can hold; the build
# chooses small heaps only because the RAM of the core is 64K
CONFIG_SYS_HEAP_AUTO=y
