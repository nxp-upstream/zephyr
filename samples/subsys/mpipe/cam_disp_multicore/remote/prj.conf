CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
# main() negotiates the pipeline and answers the calls of the other core
CONFIG_MAIN_STACK_SIZE=6000
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_MPIPE=y
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=6
CONFIG_MPIPE_BASE=y
# The pipeline server needs both application elements to be built
CONFIG_MPIPE_BASE_APP_SRC=y
CONFIG_MPIPE_BASE_APP_SINK=y
CONFIG_MPIPE_VID=y
CONFIG_MPIPE_PIPELINE_SERVER=y
CONFIG_MPIPE_VID_PIPELINE_SERVER=y
CONFIG_MPIPE_ERPC_VID_SERVER=y

# The pipeline has a source of its own, so it streams on its own thread
CONFIG_MPIPE_THREADS_NUM=1
CONFIG_MPIPE_THREAD_STACK_SIZE=2048
CONFIG_MPIPE_NET_BUF_POOL_COUNT=4
CONFIG_MPIPE_BASE_APP_SRC_BUF_SZ=4
CONFIG_MPIPE_BASE_APP_SRC_POOL_NUM=1
# The frame the client has not asked for yet
CONFIG_MPIPE_BASE_APP_SINK_QUEUE_DEPTH=1

# The image runs from the 128K of code RAM of the core
CONFIG_CBPRINTF_NANO=y

# eRPC server over the IPC service, nothing from the heap
CONFIG_ERPC=y
CONFIG_ERPC_TRANSPORT_IPC_SERVICE=y
CONFIG_ERPC_ALLOCATION_POLICY_STATIC=y
CONFIG_ERPC_CODEC_COUNT=1
CONFIG_ERPC_DEFAULT_BUFFER_SIZE=4096
CONFIG_MPIPE_ERPC_SERVER=y

# RPMsg-Lite
CONFIG_RL_API_HAS_ZEROCOPY=y
CONFIG_RL_USE_STATIC_API=y
# The other core opens the link when it creates its first channel, which
# can be seconds after the boot: wait for it longer than the default 5 s
CONFIG_IPC_SERVICE_BACKEND_RPMSG_LITE_LINK_UP_TIMEOUT_MS=60000
CONFIG_TIMESLICE_SIZE=1

# The bus carries end-of-stream and errors, never data: it needs neither
# zbus priority boost nor zbus logging of its own.
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
