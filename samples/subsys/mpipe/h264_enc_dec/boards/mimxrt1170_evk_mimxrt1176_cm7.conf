# The decoded frames are scanned out from a display plane: no driver framebuffer
CONFIG_MCUX_LCDIFV2_FB_NUM=0

# The encoder and the decoder run in the streaming thread
CONFIG_MPIPE_THREAD_STACK_SIZE=32768

# The flash is a serial one: the codecs run from the instruction TCM
CONFIG_CODEC_CODE_RELOCATE=y
CONFIG_CODEC_CODE_RAM_NAME="ITCM"

# The default RAM is the SDRAM: the codecs work in the on-chip RAM
CONFIG_CODEC_DATA_RELOCATE=y
CONFIG_CODEC_ENCODER_RAM_NAME="OCRAM1"
CONFIG_CODEC_DECODER_RAM_NAME="OCRAM2"

# Code that runs from RAM gains from being optimized for speed
CONFIG_SPEED_OPTIMIZATIONS=y
