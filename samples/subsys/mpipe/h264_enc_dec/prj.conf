CONFIG_LOG=y

CONFIG_MPIPE=y
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=4
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_CAPS_FILTER=y
CONFIG_MPIPE_VID=y
CONFIG_MPIPE_VID_CONVERT=y
CONFIG_MPIPE_VID_H264_ENCODER=y
CONFIG_MPIPE_VID_H264_DECODER=y
CONFIG_MPIPE_DISP=y
CONFIG_MPIPE_PLAYER=y
# Buffer headers in flight: the camera frame, the two converted frames, the
# frame on screen, slack
CONFIG_MPIPE_NET_BUF_POOL_COUNT=6

# Video buffers of every pool in the image: the camera's own queue of 320x240
# BGRX32 frames, the frames of the two converters, slack
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=10
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=2097152

# Picture buffers of the decoder for a 320x240 stream
CONFIG_H264SWDEC_HEAP_SIZE=393216
CONFIG_H264SWDEC_MAX_FRAME_WIDTH=320
CONFIG_H264SWDEC_MAX_FRAME_HEIGHT=240
CONFIG_H264SWDEC_MAX_FRAME_SIZE=76800

# The bus carries end-of-stream and errors, never data: it needs neither
# zbus priority boost nor zbus logging of its own.
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
