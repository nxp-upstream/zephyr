sample:
  name: mpipe Android link, pipelines described in the devicetree
tests:
  sample.mpipe.android_link_dt:
    build_only: true
    tags:
      - samples
      - shield
      - net
      - socket
      - display
      - mpipe
    # The display of the board is on its shield, so the board does not list it
    depends_on:
      - netif
    platform_allow:
      - mimxrt1170_evk/mimxrt1176/cm7
      - native_sim
      - native_sim/native/64
    modules:
      - jpegdec
    integration_platforms:
      - mimxrt1170_evk/mimxrt1176/cm7
      - native_sim
    extra_args:
      - platform:mimxrt1170_evk/mimxrt1176/cm7:SHIELD="rk055hdmipi4ma0"
