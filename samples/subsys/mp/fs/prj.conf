# Logging
CONFIG_LOG=y

CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=255

CONFIG_MP=y

# Size one caps structure for the widest union that can meet in one
# intersection, not for what a single element sets.
# The pipeline negotiates no caps field at all: a file is bytes.
CONFIG_MP_STRUCTURE_MAX_FIELDS=1
CONFIG_MP_FS=y
