#
# On QSPI XIP variants the flash is mapped at 0x90000000 while
# SRAM sits at ~0x20000000. The gap exceeds the 31-bit signed
# range of R_ARM_PREL31, so the linker cannot place the
# .ARM.exidx.ramfunc unwind entry (emitted when FRAME_POINTER is
# enabled) close enough to the .ramfunc VMA in RAM.
# Disable FRAME_POINTER for this board variant to avoid the
# "relocation truncated to fit: R_ARM_PREL31" build error.
CONFIG_FRAME_POINTER=n
