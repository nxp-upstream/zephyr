# Use a USB webcam attached to the USB host controller as the video source instead of a
# camera described in the devicetree. Layer this on top of prj.conf with
# -DEXTRA_CONF_FILE=usbh.conf, see the sample documentation.

CONFIG_USB_HOST_STACK=y
CONFIG_USBH_VIDEO_CLASS=y
# CONFIG_USBH_UAC2_CLASS=y

# Webcams offer YUYV and MJPEG. There is no in-tree JPEG decoder for most targets, so ask
# for YUYV and convert it to the RGB565 the display wants on the CPU.
CONFIG_VIDEO_PIXEL_FORMAT="YUYV"
CONFIG_VIDEO_FRAME_WIDTH=320
CONFIG_VIDEO_FRAME_HEIGHT=240
CONFIG_VIDEO_TRANSFORM_SW_YUYV=y

# One 320x240 16bpp frame is 150 KiB, so a second one does not fit next to the rest of the
# image in the 320 KiB this part has. The class driver drops the payloads that arrive while
# the application holds the only buffer, which costs frame rate but keeps the stream running.
CONFIG_VIDEO_CAM_NUM_BUFS=1
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=1
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=163840

# Room for the configuration descriptor of a webcam, which describes a video control and a
# video streaming interface with a format and a frame descriptor per mode it offers.
CONFIG_USBH_USB_DEVICE_HEAP=8912

# Every isochronous transfer in flight holds a buffer of the endpoint payload size out of the
# single UHC pool, so the pool has to cover CONFIG_USBH_VIDEO_CONCURRENT_TRANSFERS of them. A
# high bandwidth high speed endpoint carries up to 3072 bytes per microframe.
CONFIG_USBH_VIDEO_CONCURRENT_TRANSFERS=8
CONFIG_UHC_BUF_POOL_SIZE=32768

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_DEBUG_OPTIMIZATIONS=y
