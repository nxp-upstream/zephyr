common:
  tags:
    - bluetooth
  platform_allow:
    - native_sim
  harness: ztest
  sidecar: bumble

tests:
  bluetooth.classic.bumble.rfcomm:
    timeout: 120
    sidecar_config:
      bumble:
        addresses:
          - "00:00:01:00:00:01"
          - "00:00:01:00:00:02"
        devices:
          - '--peer_bd_address={addr1} -test=rfcomm_client::test_01_single_conn'
          - '--peer_bd_address={addr0} -test=rfcomm_server::test_01_single_conn'
