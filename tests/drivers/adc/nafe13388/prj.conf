CONFIG_ZTEST=y
CONFIG_EMUL=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# Short timeouts so that the timeout tests are fast. native_sim has a tick of 10 ms,
# so a sleep of 1 ms in a test lasts 10 ms; both timeouts have to be a few ticks. The wait
# for CHIP_READY is a deadline in milliseconds, not a number of polls, so with 100 ms the
# driver polls about 10 times on native_sim.
CONFIG_ADC_NAFE13388_DRDY_TIMEOUT_MS=50
CONFIG_ADC_NAFE13388_CHIP_READY_TIMEOUT_MS=100
