common:
  tags:
    - drivers
    - watchdog
  depends_on: watchdog
  harness: ztest

tests:
  drivers.watchdog.wdt_error_cases.disable_only:
    testcases:
      - wdt_coverage.08b_wdt_disable_check_not_firing
    platform_allow:
      - frdm_mcxa153
      - frdm_mcxa156
      - frdm_mcxa344
      - frdm_mcxa346
      - frdm_mcxa577
      - frdm_mcxn236
      - frdm_mcxn947/mcxn947/cpu0
    integration_platforms:
      - frdm_mcxa156
      - frdm_mcxn947/mcxn947/cpu0
    extra_configs:
      - CONFIG_TEST_WDT_DISABLE_ONLY=y
      - CONFIG_TEST_WDT_OPT_PAUSE_HALTED_BY_DBG_SUPPORTED=n
      - CONFIG_TEST_WDT_OPT_PAUSE_IN_SLEEP_SUPPORTED=n
      - CONFIG_WDT_MCUX_WWDT_WARNING_INTERRUPT_CFG=512
      - CONFIG_PM=n
      - CONFIG_PM_DEVICE=n
  drivers.watchdog.wdt_error_cases:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpunet
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54h20dk/nrf54h20/cpurad
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120/cpuapp
      - nrf9280pdk/nrf9280/cpuapp
      - nrf9280pdk/nrf9280/cpurad
      - ophelia4ev/nrf54l15/cpuapp
      - xg24_rb4187c
      - xg27_dk2602a
      - kg100s_rb4332a
      - sixg301_rb4407a
      - raytac_an54lq_db_15/nrf54l15/cpuapp
      - sam_e54_xpro
      - pic32cx_sg41_cult
      - numaker_pfm_m487
      - pic32cm_jh01_cpro
      - raytac_an54lv_db_15/nrf54l15/cpuapp
      - pic32cz_ca80_cult
      - pic32cz_ca90_cult
      - pic32cm_sg00_cpro
      - pic32cm_gc00_cpro
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
      - ophelia4ev/nrf54l15/cpuapp
      - raytac_an54lq_db_15/nrf54l15/cpuapp
      - raytac_an54lv_db_15/nrf54l15/cpuapp
  drivers.watchdog.wdt_error_cases_pm:
    platform_allow:
      - xg24_rb4187c
      - xg27_dk2602a
      - kg100s_rb4332a
      - sixg301_rb4407a
    extra_configs:
      - CONFIG_PM=y
