common:
  build_only: true
  tags:
    - drivers
    - memc
tests:
  # NXP AHB SRAM Controller (SRAMC). The driver is SoC specific (uses the
  # fsl_sramc HAL and the BLK_CTRL_WAKEUPMIX block), and nothing else in tree
  # enables a &sramc node, so build it on the mimxrt1180_evk to keep it covered.
  drivers.memc.nxp_sramc.build:
    platform_allow:
      - mimxrt1180_evk/mimxrt1189/cm33
      - mimxrt1180_evk/mimxrt1189/cm7
    integration_platforms:
      - mimxrt1180_evk/mimxrt1189/cm33

  # NXP AHB SRAM Controller (AHB_SRAMC), a different block with the same name:
  # its own peripheral, one timing register pair per chip select, and the
  # fsl_sramc HAL from the SDK's sramc_1 component. Nothing in tree enables an
  # &sramc node on this SoC either, so build it on the mimxrt2660_evk.
  drivers.memc.nxp_ahb_sramc.build:
    platform_allow:
      - mimxrt2660_evk/mimxrt2663/cm85
    integration_platforms:
      - mimxrt2660_evk/mimxrt2663/cm85
