tests:
  libmp.core.build:
    tags:
      - subsys
      - mp
    platform_allow:
      - native_sim
      - native_sim/native/64
      - mimxrt1170_evk@B/mimxrt1176/cm7
      - mimxrt685_evk/mimxrt685s/cm33
    build_only: true

  libmp.video_plugin.build:
    tags:
      - subsys
      - mp
    build_only: true
    platform_allow:
      - native_sim
      - native_sim/native/64
      - mimxrt1170_evk@B/mimxrt1176/cm7
    extra_args:
      - platform:mimxrt1170_evk/mimxrt1176/cm7:SHIELD="nxp_btb44_ov5640;rk055hdmipi4ma0"
      - platform:mimxrt1170_evk@B/mimxrt1176/cm7:SHIELD="nxp_btb44_ov5640;rk055hdmipi4ma0"
      - CONFIG_MP_PLUGIN_ZVID=y
      - CONFIG_MP_PLUGIN_ZDISP=y
      - CONFIG_VIDEO=y
      - CONFIG_DISPLAY=y
      - CONFIG_MP_PLUGIN_ZJPEG=y

  libmp.fs_plugin.build:
    tags:
      - subsys
      - mp
    build_only: true
    platform_allow:
      - native_sim
      - native_sim/native/64
      - mimxrt1170_evk@B/mimxrt1176/cm7
    extra_args:
      - CONFIG_MP_PLUGIN_ZFS=y

  libmp.audio_plugin.build:
    tags:
      - subsys
      - mp
    build_only: true
    platform_allow:
      - mimxrt685_evk/mimxrt685s/cm33
    extra_args:
      - CONFIG_I2S=y
      - CONFIG_AUDIO=y
      - CONFIG_AUDIO_DMIC=y
      - CONFIG_AUDIO_CODEC=y
      - CONFIG_MP_PLUGIN_ZAUD=y

  libmp.zbase.build:
    tags:
      - subsys
      - mp
    build_only: true
    platform_allow:
      - native_sim
      - native_sim/native/64
      - qemu_x86
      - mimxrt1170_evk@B/mimxrt1176/cm7
    extra_args:
      - CONFIG_MP_PLUGIN_ZBASE=y
      - CONFIG_MP_CAPSFILTER=y
