CONFIG_ZTEST=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_MPIPE=y
# An encoding pipeline and a decoding one
CONFIG_MPIPE_THREADS_NUM=2
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_APP_SINK=y
CONFIG_MPIPE_BASE_APP_SRC=y
# One 96x64 YUV 4:2:0 frame
CONFIG_MPIPE_BASE_APP_SRC_BUF_SZ=9216
CONFIG_MPIPE_BASE_APP_SRC_POOL_NUM=4
CONFIG_MPIPE_VID=y
CONFIG_MPIPE_VID_H264_ENCODER=y
CONFIG_MPIPE_VID_H264_ENCODER_MAX_OUT_FRAME_SIZE=9216
CONFIG_MPIPE_VID_H264_DECODER=y
CONFIG_MPIPE_VID_H264_DECODER_MAX_OUT_FRAME_SIZE=9216
# Picture buffers of a 96x64 stream, with room to spare
CONFIG_H264SWDEC_HEAP_SIZE=262144
