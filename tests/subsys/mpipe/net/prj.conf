CONFIG_ZTEST=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_MPIPE=y
CONFIG_MPIPE_THREAD_STACK_SIZE=2048
CONFIG_MPIPE_NET=y
CONFIG_MPIPE_IMG=y
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_APP_SINK=y
CONFIG_MPIPE_BASE_APP_SRC=y
# Pushed payloads up to 2 KB, a few in flight
CONFIG_MPIPE_BASE_APP_SRC_BUF_SZ=2048
CONFIG_MPIPE_BASE_APP_SRC_POOL_NUM=4
CONFIG_MPIPE_BASE_APP_SINK_QUEUE_DEPTH=8
CONFIG_ZBUS_MSG_SUBSCRIBER=y

# Small chunks so that a few frames span several of them
CONFIG_MPIPE_NET_SRC_BUF_SIZE=4096
CONFIG_MPIPE_NET_SRC_NUM_BUFS=4
CONFIG_MPIPE_NET_SRC_MIN_READ=256
CONFIG_MPIPE_IMG_JPEG_PARSER_MAX_FRAME_SIZE=2048
CONFIG_MPIPE_IMG_JPEG_PARSER_POOL_NUM=2
CONFIG_MPIPE_NET_BUF_POOL_COUNT=16

# A socket pair stands in for the network, from a static slab, no heap
CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETPAIR=y
CONFIG_NET_SOCKETPAIR_BUFFER_SIZE=4096
CONFIG_NET_SOCKETPAIR_STATIC=y
CONFIG_NET_SOCKETPAIR_MAX=2
CONFIG_ZVFS_OPEN_ADD_SIZE_NET=5
CONFIG_TEST_RANDOM_GENERATOR=y
