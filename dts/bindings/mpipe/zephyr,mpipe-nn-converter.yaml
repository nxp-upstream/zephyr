description: Pipeline element converting video frames to input tensors.

compatible: "zephyr,mpipe-nn-converter"

include: mpipe-element.yaml

properties:
  zero-point:
    type: int
    description: |
      Value added to each 8-bit sample before it is stored, the input zero
      point of the model. The samples are stored as raw bytes when absent.
