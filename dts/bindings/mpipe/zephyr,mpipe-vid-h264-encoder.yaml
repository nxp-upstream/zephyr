description: Pipeline element encoding frames to an H.264 byte stream in software.

compatible: "zephyr,mpipe-vid-h264-encoder"

include: mpipe-element.yaml

properties:
  qp:
    type: int
    default: 30
    description: |
      Quantizer used for every frame, from 10 (best quality) to 51. The
      default is a middle value: a recognizable picture at a moderate bit
      rate.

  gop:
    type: int
    default: 30
    description: |
      Key frame period in frames. 1 makes every frame a key frame; 0
      produces one key frame at the start and then only on request. The
      default gives a late receiver a starting point every second at 30
      frames per second.

  speed:
    type: int
    default: 9
    description: |
      Speed against quality, from 0 (every coding tool) to 10 (fastest).
      The default is the fastest setting that keeps the deblocking filter,
      without which the blocks of the picture show in flat areas.
