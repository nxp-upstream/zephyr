description: |
  NXP RT2K PMU performance state (pstate): one of the run modes the PMU and the
  power controller switch between.

compatible: "nxp,rt2k-pmu-pstate"

include:
  - "zephyr,pstate.yaml"

properties:
  load-threshold:
    required: true

  cpu-frequency-level:
    type: string
    required: true
    enum:
      - low
      - normal
      - high
    description: |
      Run mode of this performance state: low is Low Power Run, normal is
      Normal Run and high is HP (Over Drive) Run.
