description: |
  NXP AHB SRAM Controller (AHB_SRAMC).

  Controller for external asynchronous parallel SRAM (or SRAM-like FPGA)
  devices, found on i.MX RT266x. The controller is a peripheral in its own
  right, with VERID/MCR/LR registers plus one CFG0/CFG1 register pair per
  chip select, and is driven through the MCUXpresso SDK "sramc_1" HAL.

  This is a different hardware block from the one behind "nxp,sramc": that
  one lives inside the BLK_CTRL_WAKEUPMIX block on i.MX RT118x, has a single
  shared set of timing registers, and uses the SDK "sramc" HAL. The two are
  not interchangeable.

  Each chip select that carries an external device is described as a child
  node whose "reg" is the chip-select index. Bus timings are per chip select;
  the data-port width, address mode, ADV# polarity and AHB bus timeout are
  properties of the controller, because the hardware keeps them in the shared
  MCR register and cannot vary them per chip select.

  Timings are given in nanoseconds, straight off the SRAM part's datasheet.
  The driver reads the controller's functional clock (hclk) rate at init,
  converts each one into the matching register field, and picks the timing
  prescaler itself -- the smallest granularity in which every field of that
  chip select still fits, which is also the one with the least rounding.
  That keeps the devicetree independent of both the clock tree and the
  register encoding.

  Example for a 16-bit ADMUX SRAM on chip select 0 of an i.MX RT266x, whose
  chip-select windows are at 0x25000000 (CS0) and 0x25020000 (CS1), 128 KB
  each:

    &sramc {
        pinctrl-0 = <&pinmux_sramc>;
        pinctrl-names = "default";
        port-size = <16>;
        address-mode = "admux";
        status = "okay";

        sramc_cs0: sram@0 {
            reg = <0>;
            memory-region = <&ext_sram0>;

            ce-setup-time-ns = <0>;
            ce-hold-time-ns = <0>;
            address-setup-time-ns = <10>;
            address-hold-time-ns = <5>;
            turnaround-time-ns = <10>;
            write-enable-low-time-ns = <45>;
            write-enable-high-time-ns = <10>;
            read-enable-low-time-ns = <55>;
            read-enable-high-time-ns = <10>;
        };
    };

    / {
        ext_sram0: memory@25000000 {
            compatible = "zephyr,memory-region", "mmio-sram";
            reg = <0x25000000 DT_SIZE_K(128)>;
            zephyr,memory-region = "EXT_SRAM0";
            zephyr,memory-attr = <DT_MEM_ARM(ATTR_MPU_RAM)>;
        };
    };

  The window has to be a separate "zephyr,memory-region" node rather than the
  chip-select node itself: the chip-select windows are not inside the
  peripheral address aperture this controller sits in, so they cannot be
  address-translated as its children. Declaring them as regions is what gives
  the external SRAM a linker MEMORY{} entry, an MPU region and
  __<NAME>_start/_end symbols. Note that this driver runs at POST_KERNEL, so a
  region here can host explicitly placed sections, a heap or a buffer pool,
  but not anything the C runtime has to initialize before drivers come up.

compatible: "nxp,ahb-sramc"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true
    description: |
      The controller's functional clock (hclk). Its rate is what every timing
      field is counted in, so the driver reads it to convert the nanosecond
      timings below.

  "#address-cells":
    required: true
    const: 1

  "#size-cells":
    required: true
    const: 0

  port-size:
    type: int
    required: true
    enum: [8, 16]
    description: |
      External data-port width in bits. Must match the data width of the
      connected SRAM. Required because an 8-bit device driven at 16 bits is
      silently corrupted, and the hardware has no way to detect the mismatch.
      Shared by every chip select (MCR[PS]).

  address-mode:
    type: string
    required: true
    enum:
      - "admux"       # Address/data multiplexed
      - "non-admux"   # Address/data not multiplexed
    description: |
      Whether the low address bits are multiplexed onto the data lines.
      Required because it decides which pins the board has to route: admux
      needs SRAMC_ADVB and a turnaround time, non-admux needs the dedicated
      SRAMC_ADDR lines instead. Shared by every chip select (MCR[AM]).

  adv-polarity:
    type: string
    default: "active-low"
    enum:
      - "active-low"
      - "active-high"
    description: |
      Polarity of the ADV# address-valid strobe, used in admux mode only.
      The default is the register's power-on reset value, and is the polarity
      the signal's name implies; it is independent of every other property
      here. Shared by every chip select (MCR[ADVP]).

  bus-timeout:
    type: int
    default: 0
    min: 0
    max: 255
    description: |
      AHB bus timeout, in units of 1024 hclk cycles. An AHB access that is
      not granted within that many cycles completes with a bus error, which
      reaches the CPU as a fault. Zero -- the register's power-on reset value
      -- disables the timeout counter entirely, which is why this is a single
      property rather than a separate enable flag that could disagree with
      the count. Shared by every chip select (MCR[BTO] and MCR[BTOEN]).

  nxp,function-clock-always-on:
    type: boolean
    description: |
      Disable the controller's internal clock gating, so its functional clock
      runs even when no access is in flight (MCR[CG_DIS]). Omit it to leave
      gating enabled, which is the reset behaviour and the lower-power one.

child-binding:
  description: |
    An external device on one of the controller's chip selects. All of its
    timings are required: they come from the connected part's datasheet, there
    is no value that is safe for an unknown part, and the register fields they
    program share a per-chip-select prescaler, so they only make sense as a
    set.

  properties:
    reg:
      type: int
      required: true
      description: |
        Chip-select index this device is wired to. The number of chip selects
        is SoC specific -- i.MX RT266x has two, CS0 and CS1.

    memory-region:
      type: phandle
      required: true
      description: |
        The "zephyr,memory-region" node describing this chip select's
        memory-mapped window. Required: without it the window has no linker
        region, no MPU region and no start/end symbols, and the driver has no
        base address to report through the MEMC API.

    ce-setup-time-ns:
      type: int
      required: true
      description: |
        Time CE# is asserted before the access starts (CFG0_CS[CES]). May be 0.

    ce-hold-time-ns:
      type: int
      required: true
      description: |
        Time CE# stays asserted after the access ends (CFG0_CS[CEH]). May be 0.

    address-setup-time-ns:
      type: int
      required: true
      description: |
        Time the address is driven before the access strobe (CFG0_CS[AS]).
        May be 0, except in admux mode where the hardware always inserts one
        clock cycle.

    address-hold-time-ns:
      type: int
      required: true
      description: |
        Time the address is held after its setup phase (CFG0_CS[AH]). The
        field counts from one granularity period, so 0 selects that minimum
        rather than no hold at all.

    turnaround-time-ns:
      type: int
      required: true
      description: |
        Dead time during which neither the controller nor the device drives
        the data lines (CFG0_CS[TA]). Needed in admux mode, where the lines
        change direction between address and data; the field counts from one
        granularity period, so 0 selects that minimum.

    write-enable-low-time-ns:
      type: int
      required: true
      description: |
        WE# asserted time, which is the write pulse width (CFG1_CS[WEL]).
        Counts from one granularity period, so 0 selects that minimum.

    write-enable-high-time-ns:
      type: int
      required: true
      description: |
        WE# deasserted time between writes (CFG1_CS[WEH]). Counts from one
        granularity period, so 0 selects that minimum.

    read-enable-low-time-ns:
      type: int
      required: true
      description: |
        OE# asserted time, which has to cover the part's access time
        (CFG1_CS[REL]). Counts from one granularity period, so 0 selects that
        minimum.

    read-enable-high-time-ns:
      type: int
      required: true
      description: |
        OE# deasserted time between reads (CFG1_CS[REH]). Counts from one
        granularity period, so 0 selects that minimum.

    wait-pin:
      type: int
      min: 0
      max: 3
      description: |
        Index of the SRAMC_WP wait pin this device drives. Setting it enables
        wait-state monitoring for this chip select (CFG0_CS[WM_EN] and
        [WP_MUX]) and makes wait-mode required; omit it for a device that does
        not use a wait signal. The controller decodes four pins, but a given
        SoC routes fewer -- i.MX RT266x brings out SRAMC_WP0 and SRAMC_WP1
        only.

    wait-mode:
      type: string
      enum:
        - "level"
        - "level-and-counter"
        - "level-or-counter"
        - "edge"
        - "edge-and-counter"
        - "edge-or-counter"
      description: |
        What ends a wait state (CFG0_CS[WM_SEL]): the wait pin alone, or the
        pin combined with the internal access counter -- "and" waits for both
        to finish, "or" for either. The counter is the read-enable-low time on
        reads and the write-enable-low time on writes. Required when wait-pin
        is set, ignored otherwise.

    wait-active-high:
      type: boolean
      description: |
        The wait pin is asserted high (CFG0_CS[WP_POL]). Omit it for a
        low-asserted wait pin, which is the reset behaviour. Ignored unless
        wait-pin is set.
